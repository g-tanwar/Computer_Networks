upstream backends {
    # Backend A - Mac 3
    server 10.7.22.54:3001 max_fails=1 fail_timeout=10s;

    # Backend B - Mac 1
    server 10.7.17.154:3002 max_fails=1 fail_timeout=10s;
}

server {
    listen 443 ssl;
    http2 on;

    server_name app.team1.test api.team1.test;

    ssl_certificate /Users/gouravtanwar/cn-certs/app.crt;
    ssl_certificate_key /Users/gouravtanwar/cn-certs/app.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502;
    }
}

