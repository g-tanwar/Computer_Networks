<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 980 980">
  <rect width="980" height="980" fill="#f7f5f2"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="28" fill="#1c1917">Request flow</text>
  <text x="40" y="76" font-family="Helvetica, sans-serif" font-size="15" fill="#44403c">Mac 3 client, Mac 1 DNS, Mac 2 nginx, backends on Mac 3 and Mac 1</text>

  <rect x="330" y="110" width="320" height="78" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="490" y="142" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Client - Mac 3</text>
  <text x="490" y="166" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#44403c">10.7.22.54</text>

  <line x1="490" y1="188" x2="490" y2="230" stroke="#1c1917" stroke-width="2"/>
  <text x="504" y="214" font-family="Helvetica, sans-serif" font-size="13" fill="#44403c">DNS query app.team1.test</text>

  <rect x="330" y="230" width="320" height="78" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="490" y="262" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Mac 1 DNS - dnsmasq :53</text>
  <text x="490" y="286" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#44403c">10.7.17.154</text>

  <line x1="490" y1="308" x2="490" y2="350" stroke="#1c1917" stroke-width="2"/>
  <text x="504" y="334" font-family="Helvetica, sans-serif" font-size="13" fill="#44403c">answer 10.7.26.232, TTL 60</text>

  <rect x="330" y="350" width="320" height="78" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="490" y="382" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Client - Mac 3</text>
  <text x="490" y="406" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#44403c">10.7.22.54</text>

  <line x1="490" y1="428" x2="490" y2="470" stroke="#1c1917" stroke-width="2"/>
  <text x="504" y="454" font-family="Helvetica, sans-serif" font-size="13" fill="#44403c">HTTPS / TLS, TCP 443</text>

  <rect x="330" y="470" width="320" height="90" rx="10" fill="#1c1917"/>
  <text x="490" y="506" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f7f5f2">Mac 2 nginx</text>
  <text x="490" y="530" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#d6d3d1">10.7.26.232:443</text>

  <line x1="400" y1="560" x2="230" y2="640" stroke="#1c1917" stroke-width="2"/>
  <line x1="580" y1="560" x2="750" y2="640" stroke="#1c1917" stroke-width="2"/>

  <rect x="70" y="640" width="320" height="110" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="230" y="680" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Backend A - Mac 3</text>
  <text x="230" y="708" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#44403c">10.7.22.54:3001</text>
  <text x="230" y="730" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="13" fill="#44403c">X-Backend: A</text>

  <rect x="590" y="640" width="320" height="110" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="750" y="680" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Backend B - Mac 1</text>
  <text x="750" y="708" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#44403c">10.7.17.154:3002</text>
  <text x="750" y="730" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="13" fill="#44403c">X-Backend: B</text>

  <text x="40" y="810" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">Round-robin between the two HTTP upstreams. TLS ends at nginx. A dead upstream fails over; both dead returns 502.</text>
</svg>
