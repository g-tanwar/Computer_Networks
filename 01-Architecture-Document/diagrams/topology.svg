<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100">
  <rect width="1100" height="1100" fill="#f7f5f2"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="28" fill="#1c1917">Team 1 LAN topology</text>
  <text x="40" y="76" font-family="Helvetica, sans-serif" font-size="15" fill="#44403c">10.7.0.0/19 | gateway 10.7.0.1 | mask 255.255.224.0 | interface en0</text>

  <rect x="40" y="120" width="300" height="180" rx="12" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="60" y="156" font-family="Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1c1917">Mac 1 - Piyush</text>
  <text x="60" y="186" font-family="Menlo, monospace" font-size="15" fill="#1c1917">10.7.17.154</text>
  <text x="60" y="212" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">MAC 10:9f:41:c0:9e:e5</text>
  <text x="60" y="240" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">dnsmasq UDP/TCP 53</text>
  <text x="60" y="264" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">Backend B TCP 3002</text>

  <rect x="400" y="120" width="300" height="180" rx="12" fill="#1c1917"/>
  <text x="420" y="156" font-family="Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f7f5f2">Mac 2 - Gourav</text>
  <text x="420" y="186" font-family="Menlo, monospace" font-size="15" fill="#f7f5f2">10.7.26.232</text>
  <text x="420" y="212" font-family="Helvetica, sans-serif" font-size="14" fill="#d6d3d1">MAC e6:09:91:27:22:3b</text>
  <text x="420" y="240" font-family="Helvetica, sans-serif" font-size="14" fill="#d6d3d1">nginx HTTPS 443</text>
  <text x="420" y="264" font-family="Helvetica, sans-serif" font-size="14" fill="#d6d3d1">TLS 1.2 / 1.3, HTTP/2</text>

  <rect x="760" y="120" width="300" height="180" rx="12" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
  <text x="780" y="156" font-family="Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1c1917">Mac 3 - Alok</text>
  <text x="780" y="186" font-family="Menlo, monospace" font-size="15" fill="#1c1917">10.7.22.54</text>
  <text x="780" y="212" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">MAC 72:36:67:c5:54:98</text>
  <text x="780" y="240" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">Backend A TCP 3001</text>
  <text x="780" y="264" font-family="Helvetica, sans-serif" font-size="14" fill="#44403c">Client, dig, curl, Wireshark</text>

  <line x1="340" y1="210" x2="400" y2="210" stroke="#1c1917" stroke-width="2"/>
  <line x1="700" y1="210" x2="760" y2="210" stroke="#1c1917" stroke-width="2"/>

  <rect x="40" y="360" width="1020" height="220" rx="12" fill="#ffffff" stroke="#a8a29e"/>
  <text x="64" y="400" font-family="Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1c1917">Names and paths</text>
  <text x="64" y="436" font-family="Menlo, monospace" font-size="16" fill="#1c1917">app.team1.test -&gt; 10.7.26.232    TTL 60    DNS 10.7.17.154</text>
  <text x="64" y="466" font-family="Menlo, monospace" font-size="16" fill="#1c1917">api.team1.test -&gt; 10.7.26.232    TTL 60</text>
  <text x="64" y="508" font-family="Helvetica, sans-serif" font-size="15" fill="#44403c">Client DNS query goes to Mac 1. HTTPS goes to Mac 2 port 443.</text>
  <text x="64" y="536" font-family="Helvetica, sans-serif" font-size="15" fill="#44403c">nginx proxies HTTP to Backend A on Mac 3 and Backend B on Mac 1.</text>
</svg>
